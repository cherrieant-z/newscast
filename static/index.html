<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>搞钱情报 · 每日语音早报</title>
  <meta name="description" content="每天早晨 6 点前自动更新：一段听完就够的语音早报，AI 动态、一人公司拆解、宏观大势，全在音频里，不用看文字。">

  <!-- PWA 元数据 (采用相对路径完美适配 GitHub Pages) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./static/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="./static/icons/icon.svg">

  <!-- Tailwind CSS & 图标库 & Markdown 渲染 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* 适配 iPhone 底部安全区域 */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes soundwave {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    .wave-bar {
      animation: soundwave 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { animation-delay: 0.3s; }
    /* 折叠区箭头 */
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .chev { transform: rotate(90deg); }
    .chev { transition: transform .2s ease; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white">

  <!-- 顶部状态栏与导航 -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#090d16]/85 border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 flex-shrink-0">
          <i data-lucide="radio" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-[15px] font-bold tracking-tight text-white flex items-center gap-1.5">
            搞钱情报
            <span class="text-[11px] font-semibold tracking-wide px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">语音早报</span>
          </h1>
          <p id="topDateStr" class="text-[12.5px] text-slate-400 mt-0.5">正在同步今日早报...</p>
        </div>
      </div>

      <!-- 右侧操作区：往期列表 & PWA安装 -->
      <div class="flex items-center space-x-2">
        <button id="btnHistory" class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 transition-all border border-slate-700/60 flex items-center gap-1.5 text-[13px]">
          <i data-lucide="calendar" class="w-4 h-4 text-sky-400"></i>
          <span>往期</span>
        </button>
        <button id="btnPwaInstall" class="hidden px-2.5 py-2 rounded-xl bg-sky-600/20 text-sky-400 border border-sky-500/30 text-[13px] items-center gap-1.5">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>安装</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区域 (留出底部悬浮播放器空间) -->
  <main class="max-w-xl mx-auto px-4 pt-4 pb-44 space-y-5">

    <!-- 顶部状态提示横幅 -->
    <div id="statusBanner" class="px-3.5 py-3 rounded-2xl bg-gradient-to-r from-sky-950/40 via-indigo-950/30 to-purple-950/40 border border-sky-800/30 text-[13px] flex items-center justify-between gap-2 text-sky-100">
      <div class="flex items-center space-x-2 min-w-0">
        <span class="flex h-2 w-2 relative flex-shrink-0">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span id="bannerText" class="truncate">6:00 前自动更新 · 正在同步</span>
      </div>
      <span class="text-[12px] text-slate-400 font-mono flex-shrink-0"><span id="issueNo">-</span> 期</span>
    </div>

    <!-- 播放主卡：页面第一屏就是「按一下，开始听」 -->
    <section id="sectionPlayer" class="relative overflow-hidden rounded-3xl bg-gradient-to-b from-slate-800/90 via-slate-900/95 to-slate-950 border border-sky-500/25 shadow-2xl p-5">
      <div class="absolute -right-10 -top-12 w-44 h-44 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex items-center gap-4">
        <button id="btnHeroPlay" class="relative w-[64px] h-[64px] rounded-full bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-sky-500/30 active:scale-95 transition-all">
          <i data-lucide="play" class="w-7 h-7 text-white fill-current ml-1" id="heroPlayIcon"></i>
          <i data-lucide="pause" class="w-7 h-7 text-white fill-current hidden" id="heroPauseIcon"></i>
        </button>
        <div class="min-w-0">
          <h2 class="text-[19px] font-bold leading-snug text-white">今天的语音早报</h2>
          <p class="text-[13px] text-slate-400 mt-1.5">
            <span id="heroDate">--</span> · 全程 <span id="heroDuration" class="text-slate-300 font-mono">--:--</span>
          </p>
          <p id="heroHook" class="text-[12.5px] text-slate-500 mt-1 leading-[1.6]">不用看字，戴上耳机就能听完</p>
        </div>
      </div>

      <p id="heroCase" class="mt-3.5 text-[13px] text-slate-400 leading-[1.7] line-clamp-2"></p>

      <!-- 章节：点一下跳到对应位置 -->
      <div id="chapterWrap" class="mt-4 hidden">
        <div class="flex items-center justify-between mb-2.5">
          <h3 class="text-[13.5px] font-semibold text-slate-300 flex items-center gap-1.5">
            <i data-lucide="list" class="w-4 h-4 text-sky-400"></i>
            章节 · 点一下跳过去
          </h3>
          <span class="text-[11.5px] text-slate-500">时间点为估算</span>
        </div>
        <div id="chapterList" class="grid grid-cols-2 gap-2"></div>
      </div>

      <!-- 文字稿折叠：想查的时候再点开，不占默认视线 -->
      <details class="mt-4 pt-3.5 border-t border-slate-800/80">
        <summary class="flex items-center justify-between text-[13px] text-slate-400">
          <span class="flex items-center gap-1.5">
            <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
            文字稿与原文清单（备查，不听时再点开）
          </span>
          <i data-lucide="chevron-right" class="chev w-4 h-4 text-slate-500"></i>
        </summary>
        <div id="transcript" class="mt-3 text-[14.5px] leading-[1.85] text-slate-300 space-y-2"></div>
      </details>
    </section>

    <!-- 全球市场行情卡：打开页面时实时拉取，是页面上唯一「需要看」的东西 -->
    <section id="sectionMarket" class="rounded-3xl bg-slate-900/70 border border-slate-800/80 p-4">
      <div class="flex items-center justify-between gap-2 mb-3">
        <h3 class="text-[16px] font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="trending-up" class="w-[18px] h-[18px] text-sky-400"></i>
          全球市场 · 最新收盘
        </h3>
        <span id="marketStamp" class="text-[12px] text-slate-400 font-mono">读取中</span>
      </div>
      <div id="marketGrid" class="grid grid-cols-3 gap-2">
        <div class="col-span-3 py-6 text-center text-[13px] text-slate-500">正在读取行情…</div>
      </div>
      <p class="text-[12.5px] text-slate-400 leading-[1.7] mt-3">
        打开时实时读取；接口不通就显示最近一次收盘快照。音频在前一晚生成，不含最新一夜的变动。
      </p>
    </section>

  </main>

  <!-- 往期历史侧边抽屉/弹窗 -->
  <div id="historyModal" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all pointer-events-auto">
    <div class="bg-slate-900 border border-slate-700/80 rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[75vh] flex flex-col overflow-hidden shadow-2xl mb-24 sm:mb-0">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4 text-sky-400"></i>
          往期语音早报
        </h3>
        <button id="btnCloseHistory" class="p-2 rounded-lg hover:bg-slate-800 text-slate-300 active:scale-95 transition-all">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="historyListContainer" class="p-4 overflow-y-auto space-y-2.5 divide-y divide-slate-800/50 pb-10 flex-1 overscroll-contain" style="-webkit-overflow-scrolling: touch; touch-action: pan-y;">
        <!-- 动态历史条目 -->
      </div>
    </div>
  </div>

  <!-- 底部悬浮音频播放器 (Sticky Floating Player) -->
  <div id="bottomPlayer" class="fixed bottom-0 left-0 right-0 z-50 p-2 sm:p-4 pointer-events-none pb-safe">
    <div class="max-w-xl mx-auto pointer-events-auto rounded-3xl bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 shadow-2xl shadow-black/80 px-4 py-3 flex flex-col space-y-2">

      <!-- 进度条与时间显示 -->
      <div class="flex items-center space-x-2.5">
        <span id="playerCurrentTime" class="text-[11.5px] font-mono text-slate-400 w-9 text-right">00:00</span>
        <div class="relative flex-1 flex items-center cursor-pointer group py-1" id="progressContainer">
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-gradient-to-r from-sky-500 to-indigo-500 rounded-full w-0 transition-all duration-100"></div>
          </div>
          <input type="range" id="progressRange" min="0" max="100" value="0" step="0.1" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        </div>
        <span id="playerTotalTime" class="text-[11.5px] font-mono text-slate-400 w-9">00:00</span>
      </div>

      <!-- 播放器核心控制栏 -->
      <div class="flex items-center justify-between">
        <!-- 左侧信息区 (头像 + 标题) -->
        <div class="flex items-center space-x-2.5 overflow-hidden pr-2">
          <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-700 flex-shrink-0 flex items-center justify-center shadow-md">
            <div id="waveAnimation" class="flex items-end justify-center space-x-0.5 w-5 h-5 hidden">
              <span class="w-0.5 bg-white rounded-full wave-bar"></span>
              <span class="w-0.5 bg-white rounded-full wave-bar"></span>
              <span class="w-0.5 bg-white rounded-full wave-bar"></span>
              <span class="w-0.5 bg-white rounded-full wave-bar"></span>
            </div>
            <i id="waveIconStatic" data-lucide="mic" class="w-5 h-5 text-white"></i>
          </div>
          <div class="truncate">
            <div id="playerTitle" class="text-[13.5px] font-semibold text-white truncate">每日语音早报</div>
            <div id="playerSubtitle" class="text-[11.5px] text-slate-400 truncate">AI 动态 · 一人公司 · 宏观大势</div>
          </div>
        </div>

        <!-- 右侧控制区 (后退15s, 播放/暂停, 快进15s, 倍速切换) -->
        <div class="flex items-center space-x-2 flex-shrink-0">
          <button id="btnRewind15" title="快退 15 秒" class="p-2 text-slate-300 hover:text-white active:scale-90 transition-transform">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>

          <button id="btnPlayPause" class="w-11 h-11 rounded-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:brightness-110 active:scale-95 text-white flex items-center justify-center shadow-lg shadow-sky-500/30 transition-all">
            <span id="playIconWrapper"><i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i></span>
            <span id="pauseIconWrapper" class="hidden"><i data-lucide="pause" class="w-5 h-5 fill-current"></i></span>
          </button>

          <button id="btnForward15" title="快进 15 秒" class="p-2 text-slate-300 hover:text-white active:scale-90 transition-transform">
            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
          </button>

          <button id="btnSpeed" title="调整播报倍速" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-sky-400 font-mono text-[13px] font-semibold">
            1.0x
          </button>
        </div>
      </div>

    </div>
  </div>

  <audio id="audioElement" preload="metadata"></audio>

  <script>
    let currentReport = null;
    let allReports = [];
    let currentSpeedIndex = 1;
    const speeds = [0.75, 1.0, 1.25, 1.5, 2.0];

    const audio = document.getElementById('audioElement');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnHeroPlay = document.getElementById('btnHeroPlay');
    const heroPlayIcon = document.getElementById('heroPlayIcon');
    const heroPauseIcon = document.getElementById('heroPauseIcon');
    const progressBar = document.getElementById('progressBar');
    const progressRange = document.getElementById('progressRange');
    const playerCurrentTime = document.getElementById('playerCurrentTime');
    const playerTotalTime = document.getElementById('playerTotalTime');
    const btnRewind15 = document.getElementById('btnRewind15');
    const btnForward15 = document.getElementById('btnForward15');
    const btnSpeed = document.getElementById('btnSpeed');
    const waveAnimation = document.getElementById('waveAnimation');
    const waveIconStatic = document.getElementById('waveIconStatic');
    const btnHistory = document.getElementById('btnHistory');
    const historyModal = document.getElementById('historyModal');
    const btnCloseHistory = document.getElementById('btnCloseHistory');

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // ---------- 全球市场行情卡 ----------
    // 东方财富公开行情接口：允许跨域、无需密钥、国内直连。音频在前一晚生成，
    // 看不到最新一夜的变动，所以打开页面时实时补一次，让眼睛和耳朵各管一半。
    const MARKET_ITEMS = [
      { secid: '100.DJIA',  name: '道琼斯' },
      { secid: '100.NDX',   name: '纳斯达克' },
      { secid: '100.SPX',   name: '标普500' },
      { secid: '1.000001',  name: '上证指数' },
      { secid: '0.399006',  name: '创业板指' },
      { secid: '101.GC00Y', name: '黄金' }
    ];

    function formatPrice(v) {
      if (typeof v !== 'number' || isNaN(v)) return '—';
      return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderMarketRows(items, stampText) {
      const grid = document.getElementById('marketGrid');
      const stamp = document.getElementById('marketStamp');
      if (!grid) return;
      grid.innerHTML = items.map(it => {
        const pct = (typeof it.pct === 'number' && !isNaN(it.pct)) ? it.pct : null;
        // 涨红跌绿，跟国内看盘习惯一致
        const color = (pct === null || pct === 0) ? '#94a3b8' : (pct > 0 ? '#f87171' : '#4ade80');
        const change = (pct === null || pct === 0)
          ? '持平'
          : (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(2) + '%';
        return `
          <div class="rounded-2xl bg-slate-800/60 border border-slate-700/60 px-2 py-3 text-center">
            <div class="text-[12.5px] text-slate-300 truncate mb-1.5">${it.name}</div>
            <div class="text-[15px] font-bold text-slate-100 font-mono tabular-nums leading-tight">${formatPrice(it.price)}</div>
            <div class="text-[13px] font-semibold font-mono tabular-nums mt-1" style="color:${color}">${change}</div>
          </div>`;
      }).join('');
      if (stamp) stamp.innerText = stampText;
    }

    async function loadMarket() {
      const grid = document.getElementById('marketGrid');
      if (!grid) return;
      try {
        const ids = MARKET_ITEMS.map(i => i.secid).join(',');
        const url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&fields=f2,f3,f4,f12,f13,f14&secids=' + encodeURIComponent(ids);
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const rows = (data && data.data && data.data.diff) || [];
        if (!rows.length) throw new Error('接口无数据');

        const byCode = {};
        rows.forEach(r => { byCode[r.f13 + '.' + r.f12] = r; });

        const items = MARKET_ITEMS.map(it => {
          const r = byCode[it.secid];
          if (!r) return null;
          const pct = parseFloat(r.f3);
          return { name: it.name, price: r.f2, pct: isNaN(pct) ? null : pct };
        }).filter(Boolean);
        if (!items.length) throw new Error('无可用品种');

        const now = new Date();
        const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        renderMarketRows(items, hhmm + ' 更新');
      } catch (e) {
        // 实时接口连不上时退回收盘快照，别让这块直接消失
        try {
          const snapResp = await fetch('./data/market.json?t=' + Date.now(), { cache: 'no-store' });
          if (!snapResp.ok) throw new Error('无快照');
          const snap = await snapResp.json();
          if (!snap || !Array.isArray(snap.items) || !snap.items.length) throw new Error('快照为空');
          const t = (snap.updated || '').slice(5);
          renderMarketRows(snap.items, t + ' 收盘');
        } catch (e2) {
          const sec = document.getElementById('sectionMarket');
          if (sec) sec.style.display = 'none';
          console.warn('[行情] 实时与快照均不可用，已隐藏行情卡：', e, e2);
        }
      }
    }

    // 双模加载器：优先加载静态 data/reports.json (GitHub Pages)，备选本地 FastAPI /api
    async function loadReports() {
      try {
        const staticResp = await fetch('./data/reports.json?t=' + Date.now()).catch(() => null);
        if (staticResp && staticResp.ok) {
          const list = await staticResp.json();
          if (Array.isArray(list) && list.length > 0) {
            allReports = list;
            const issueNo = document.getElementById('issueNo');
            if (issueNo) issueNo.innerText = list.length;
            renderReport(allReports[0]);
            renderHistoryModal(allReports);
            return;
          }
        }

        // 备用：从本地 FastAPI 获取
        const apiResp = await fetch('/api/reports/latest');
        if (apiResp.ok) {
          const report = await apiResp.json();
          allReports = [report];
          renderReport(report);
        }
      } catch (err) {
        console.error('加载简报数据失败:', err);
      }
    }

    // 顶部横幅如实反映「今天有没有新内容」，避免用户以为没更新
    function updateBanner(report) {
      const el = document.getElementById('bannerText');
      if (!el || !report) return;
      const now = new Date();
      const today = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');
      if (report.date_str === today) {
        el.innerText = '今日已就绪 · 6:00 前自动更新';
      } else {
        el.innerText = '今日未更新 · 最新 ' + report.date_str.slice(5);
      }
    }

    // 章节列表：点一下把音频跳到该段开头
    function renderChapters(report) {
      const list = document.getElementById('chapterList');
      const wrap = document.getElementById('chapterWrap');
      if (!list || !wrap) return;
      const chapters = Array.isArray(report.chapters) ? report.chapters : [];
      if (!chapters.length) {
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');
      list.innerHTML = chapters.map((c, i) => `
        <button class="chapter-chip flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl bg-slate-800/70 border border-slate-700/70 text-slate-300 text-[13px] active:scale-95 transition-all" data-start="${c.start || 0}">
          <span class="truncate">${c.label}</span>
          <span class="font-mono text-[11.5px] text-sky-400 flex-shrink-0">${formatTime(c.start || 0)}</span>
        </button>`).join('');

      list.querySelectorAll('.chapter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const start = parseFloat(btn.getAttribute('data-start')) || 0;
          audio.currentTime = start;
          if (audio.paused) audio.play().catch(() => {});
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
      highlightChapter(audio.currentTime || 0);
    }

    // 播到哪一段，就把那一段高亮出来
    function highlightChapter(t) {
      const chapters = (currentReport && currentReport.chapters) || [];
      const chips = document.querySelectorAll('.chapter-chip');
      if (!chapters.length || !chips.length) return;
      let active = 0;
      chapters.forEach((c, i) => { if (t >= (c.start || 0) - 0.5) active = i; });
      chips.forEach((chip, i) => {
        chip.classList.toggle('bg-sky-500/25', i === active);
        chip.classList.toggle('border-sky-500/60', i === active);
        chip.classList.toggle('text-white', i === active);
      });
    }

    function renderTranscript(report) {
      const el = document.getElementById('transcript');
      if (!el) return;
      const md = report.markdown_content || '';
      if (!md) {
        el.innerHTML = '<p class="text-[14px] text-slate-500">本期暂无文字稿。</p>';
        return;
      }
      try {
        el.innerHTML = marked.parse(md);
        // 标题和正文统一压到手机好读的尺寸
        el.querySelectorAll('h1').forEach(h => h.className = 'text-[17px] font-bold text-white mt-3 mb-2');
        el.querySelectorAll('h2').forEach(h => h.className = 'text-[16px] font-bold text-white mt-4 mb-2');
        el.querySelectorAll('h3').forEach(h => h.className = 'text-[15px] font-semibold text-slate-100 mt-3 mb-1.5');
        el.querySelectorAll('h4').forEach(h => h.className = 'text-[14.5px] font-semibold text-slate-100 mt-2 mb-1');
        el.querySelectorAll('p').forEach(p => p.className = 'text-[14.5px] leading-[1.85] text-slate-300 my-1.5');
        el.querySelectorAll('li').forEach(li => li.className = 'text-[14px] leading-[1.8] text-slate-300 ml-4 list-disc');
        el.querySelectorAll('blockquote').forEach(b => b.className = 'border-l-2 border-amber-400/60 pl-3 my-2 text-amber-100/90');
        el.querySelectorAll('hr').forEach(h => h.className = 'border-slate-800 my-3');
        el.querySelectorAll('a').forEach(a => {
          a.className = 'text-sky-400 break-all';
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        });
      } catch (e) {
        el.innerText = md.slice(0, 3000);
      }
    }

    function renderReport(report) {
      currentReport = report;
      updateBanner(report);
      document.getElementById('topDateStr').innerText = report.date_str + ' · 晨间搞钱特辑';
      document.getElementById('heroDate').innerText = report.date_str;
      document.getElementById('heroDuration').innerText = report.audio_duration_str || '--:--';
      document.getElementById('playerTotalTime').innerText = report.audio_duration_str || '00:00';
      document.getElementById('playerTitle').innerText = report.lead_title || report.title;

      // 一行说清今天里面有什么，省得用户点进去才知道
      const counts = {};
      (report.sources || []).forEach(s => { counts[s.category] = (counts[s.category] || 0) + 1; });
      const hookParts = [];
      if (counts['AI Agent']) hookParts.push('AI ' + counts['AI Agent']);
      if (counts['一人公司']) hookParts.push('一人公司 ' + counts['一人公司']);
      if (counts['宏观大势']) hookParts.push('大势 ' + counts['宏观大势']);
      const hookEl = document.getElementById('heroHook');
      if (hookEl) hookEl.innerText = hookParts.length ? hookParts.join(' · ') : '不用看字，戴上耳机就能听完';

      const caseEl = document.getElementById('heroCase');
      if (caseEl) {
        caseEl.innerText = report.lead_title ? '今天的案例：' + report.lead_title : '';
      }

      renderChapters(report);
      renderTranscript(report);

      // 音频源挂载 (自动挂载音频直链，安全防护加载)
      if (report.audio_url) {
        const audioSrc = report.audio_url;
        // 只有当音频源变更时才重新赋值加载
        if (!audio.src || !audio.src.includes(audioSrc.split('?')[0])) {
          audio.src = audioSrc;
          audio.load();
        }
      }

      setupMediaSession(report);
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function renderHistoryModal(reports) {
      const container = document.getElementById('historyListContainer');
      container.innerHTML = '';
      reports.forEach((r) => {
        const item = document.createElement('div');
        item.className = 'pt-2.5 first:pt-0 cursor-pointer hover:bg-slate-800/40 p-2 rounded-xl transition-all';
        item.innerHTML = `
          <div class="flex items-center justify-between text-[12.5px] mb-1">
            <span class="font-semibold text-sky-400">${r.date_str}</span>
            <span class="text-slate-400 font-mono">${r.audio_duration_str}</span>
          </div>
          <p class="text-[14px] font-medium text-slate-200 line-clamp-1">${r.lead_title || r.title}</p>
        `;
        item.addEventListener('click', () => {
          renderReport(r);
          historyModal.classList.add('hidden');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          if (audio.paused) togglePlay();
        });
        container.appendChild(item);
      });
    }

    btnHistory.addEventListener('click', () => {
      historyModal.classList.remove('hidden');
      lucide.createIcons();
    });
    btnCloseHistory.addEventListener('click', () => {
      historyModal.classList.add('hidden');
    });

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => updatePlayUI(true)).catch(err => {
          console.error('播放失败:', err);
          updatePlayUI(false);
        });
      } else {
        audio.pause();
        updatePlayUI(false);
      }
    }

    function updatePlayUI(isPlaying) {
      const playWrap = document.getElementById('playIconWrapper');
      const pauseWrap = document.getElementById('pauseIconWrapper');
      if (playWrap && pauseWrap) {
        if (isPlaying) {
          playWrap.classList.add('hidden');
          pauseWrap.classList.remove('hidden');
        } else {
          playWrap.classList.remove('hidden');
          pauseWrap.classList.add('hidden');
        }
      }
      // 大按钮图标同步
      if (heroPlayIcon && heroPauseIcon) {
        heroPlayIcon.classList.toggle('hidden', isPlaying);
        heroPauseIcon.classList.toggle('hidden', !isPlaying);
      }
      if (waveAnimation) {
        waveAnimation.classList.toggle('hidden', !isPlaying);
        waveIconStatic.classList.toggle('hidden', isPlaying);
      }
    }

    audio.addEventListener('play', () => updatePlayUI(true));
    audio.addEventListener('pause', () => updatePlayUI(false));

    btnPlayPause.addEventListener('click', togglePlay);
    btnHeroPlay.addEventListener('click', togglePlay);

    btnRewind15.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 15);
    });
    btnForward15.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 15);
    });

    btnSpeed.addEventListener('click', () => {
      currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
      const speed = speeds[currentSpeedIndex];
      audio.playbackRate = speed;
      btnSpeed.innerText = speed.toFixed(speed % 1 === 0 ? 1 : 2) + 'x';
    });

    audio.addEventListener('loadedmetadata', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        playerTotalTime.innerText = formatTime(audio.duration);
        const heroDur = document.getElementById('heroDuration');
        if (heroDur) heroDur.innerText = formatTime(audio.duration);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        progressRange.value = pct;
        playerCurrentTime.innerText = formatTime(audio.currentTime);
        playerTotalTime.innerText = formatTime(audio.duration);
        highlightChapter(audio.currentTime);
      }
    });

    audio.addEventListener('ended', () => {
      updatePlayUI(false);
      progressBar.style.width = '0%';
      progressRange.value = 0;
    });

    progressRange.addEventListener('input', (e) => {
      if (!isNaN(audio.duration)) {
        const targetSec = (e.target.value / 100) * audio.duration;
        audio.currentTime = targetSec;
      }
    });

    function setupMediaSession(report) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: report.lead_title || report.title,
          artist: '搞钱情报 · 每日语音早报',
          album: `NewsCast · ${report.date_str}`,
          artwork: [
            { src: './static/icons/icon.svg', sizes: '512x512', type: 'image/svg+xml' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('seekbackward', (details) => {
          const skip = details.seekOffset || 15;
          audio.currentTime = Math.max(audio.currentTime - skip, 0);
        });
        navigator.mediaSession.setActionHandler('seekforward', (details) => {
          const skip = details.seekOffset || 15;
          audio.currentTime = Math.min(audio.currentTime + skip, audio.duration || 9999);
        });
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('[PWA] SW register skipped:', err);
        });
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const pwaBtn = document.getElementById('btnPwaInstall');
      pwaBtn.classList.remove('hidden');
      pwaBtn.classList.add('flex');
      pwaBtn.addEventListener('click', () => {
        pwaBtn.classList.add('hidden');
        deferredPrompt.prompt();
      });
    });

    loadReports();
    loadMarket();
    lucide.createIcons();
  </script>
</body>
</html>
