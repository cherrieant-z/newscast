name: Probe Sources

# 加源前的探活专用：只抓 RSS / API，不生成、不合成音频、不碰 docs。
# 放在这里是刻意的——生产跑在 GitHub 的机器上（海外网络），
# 本地能不能连通参考价值有限，必须用和生产同一出口去看。
on:
  workflow_dispatch:
  # 改探活清单就顺手跑一遍：加源这件事，写代码的人当场就该看到
  # 「这个源到底有没有东西」，而不是等第二天早上的节目里才发现是空的。
  push:
    paths:
      - 'tools/probe_sources.py'
      - '.github/workflows/probe_sources.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 比生产的 3.12 更严格，能在本地之外提前抓到语法兼容问题
          cache: 'pip'
      - name: Install deps
        # 装齐生产同款依赖：探活要 import app.collector 里的解析器，
        # 少一个 bs4 就直接 ModuleNotFoundError，白跑一趟。
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts httpx beautifulsoup4 markdown pydantic pydantic-settings
      - name: Syntax check
        run: python -m compileall -q build_daily.py app tools
      - name: Probe
        run: python tools/probe_sources.py
