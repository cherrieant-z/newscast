name: Daily NewsCast Broadcast & Cloud Deployment

on:
  schedule:
    # 提前到北京时间 05:30 生成，06:10 兜底重跑，确保 6 点睁眼打开播客 App 就有新节目
    - cron: '30 21 * * *'
    - cron: '10 22 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上随时一键手动测试触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts httpx beautifulsoup4 markdown pydantic pydantic-settings

      - name: Generate Daily Briefing & Synthesize Edge-TTS Audio
        run: |
          python build_daily.py

      - name: Commit & Push New Audio and Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动生成每日深度播客 [$(date '+%Y-%m-%d')]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
