name: Daily NewsCast Broadcast & Cloud Deployment

on:
  schedule:
    # GitHub 免费版定时任务是「排队制」：到点只是进队列，等有闲置机器才真正开跑。
    # 实测 13 次，设定时刻与实际开跑稳定相差 3~5.5 小时，设 05:30 实际永远在 08:46 之后。
    # 所以反过来利用这个延迟：把「发车时间」放到前一天深夜，让延迟把它推进凌晨 2~5 点，
    # 早上 6 点前必定已经生成并部署完毕。三个时间点互为兜底，先跑成功的会写入数据，
    # 后面的检测到当天已生成会自动跳过（见 build_daily.py 的幂等判断）。
    - cron: '0 15 * * *'   # 北京 23:00 → 实际约 02:00-04:30 跑完
    - cron: '40 15 * * *'  # 北京 23:40 → 兜底
    - cron: '20 16 * * *'  # 北京次日 00:20 → 兜底
  workflow_dispatch: # 支持在 GitHub 网页上随时一键手动测试触发（手动触发会强制覆盖当天记录）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts httpx beautifulsoup4 markdown pydantic pydantic-settings

      - name: Generate Daily Briefing & Synthesize Edge-TTS Audio
        # DeepSeek key 存在仓库 Secrets 里，不要写进代码。
        # 没配这个 secret 也能正常跑：模型那一层会自动跳过，
        # 只是少了英文前沿源的中文翻译和案例深度拆解。
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python build_daily.py

      - name: Commit & Push New Audio and Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自动生成每日深度播客 [$(date '+%Y-%m-%d')]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
