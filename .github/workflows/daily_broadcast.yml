name: Daily NewsCast Broadcast & Cloud Deployment

on:
  schedule:
    # 这里踩过两次坑，记清楚免得再犯：
    #
    # 坑一（旧）：把发车时间设成「目标时刻减去预期延迟」。延迟实测从 4.0~4.2 小时
    # （11-07/08）跳到 8.3~9.2 小时（11-09），一跳就整盘落空，而且日志里一切正常。
    #
    # 坑二（现在）：不再猜延迟，改成「多点覆盖 + 代码判定窗口」。
    # 发布窗口在北京 01:30~05:30（= UTC 17:30~21:30）。延迟 d 小时时，
    # 实际开跑 = 发车点 + d，要让某一趟落进窗口，发车点需覆盖 [01:30, 21:30] UTC。
    # 每 3 小时一格、窗口宽 4 小时 > 间隔 3 小时，数学上保证
    # 无论延迟在 0~15 小时内怎么浮动，至少有一趟会落进窗口。
    # 落在窗口外的趟次会被 build_daily 的 _publish_decision 直接挡掉，不生成、不烧额度。
    - cron: '0 3 * * *'    # 覆盖延迟 14~15h
    - cron: '0 6 * * *'    # 覆盖延迟 11~12h
    - cron: '0 9 * * *'    # 覆盖延迟  8~9h（11-09 就是这一档）
    - cron: '0 12 * * *'   # 覆盖延迟  5~6h
    - cron: '0 15 * * *'   # 覆盖延迟  2~4h（11-07/08 是这一档）
    - cron: '0 18 * * *'   # 覆盖延迟  0~2h
    - cron: '0 21 * * *'   # 覆盖窗口末端，延迟为负向波动时的兜底
  workflow_dispatch: # 支持在 GitHub 网页上随时一键手动测试触发（手动触发会强制覆盖当天记录）

  # 只改前端 / 补文案时立刻上线，不用等下一趟定时任务。
  #
  # 关键：这类推送只部署、不重新生成（见下面两个步骤的 if 条件）。
  # 如果让它照常跑一遍生成，任何一次改错字都会在半夜做出一期早报，
  # 而半夜 12 点前生成的那期必然错过美股全天——还会把后面几趟定时任务
  # 全部判成「够新鲜」而跳过，等于用一次改错字把当天内容锁死。
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 不设上限时默认 360 分钟。edge-tts 一旦半开连接，整趟会挂满 6 小时，
    # 期间占着 concurrency 锁，把后面两趟兜底全顶掉。45 分钟足够跑完并重试。
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        # 纯部署的推送不需要 Python，跳过能省掉装依赖的二十几秒
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts httpx beautifulsoup4 markdown pydantic pydantic-settings

      - name: Generate Daily Briefing & Synthesize Edge-TTS Audio
        # 推送触发的这趟只部署，不生成：半夜随手改个字不该产出一期错过美股全天的早报。
        # DeepSeek key 存在仓库 Secrets 里，不要写进代码。
        # 没配这个 secret 也能正常跑：模型那一层会自动跳过，
        # 只是少了英文前沿源的中文翻译和案例深度拆解。
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 每日一个 GitHub 项目那块要搜仓库、读 README。
          # 不带 token 的搜索接口一分钟只给十次，六条查询跑到一半就开始 403；
          # 带上这个自动签发的 token，配额是三十次，够用。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build_daily.py

      - name: Commit & Push New Audio and Data
        if: github.event_name != 'push'
        # 构建期间远端可能有新提交（人工改前端、改 README），直接 push 会被拒。
        # 以前一旦被拒，步骤失败，后面的 Pages 部署跟着跳过——音频已经生成好了却上不了线。
        # 现在：先 rebase 再推，失败重试三次；三次都失败也只告警，因为 Pages 用的是本地
        # docs/ 上传的 artifact，不依赖这次 push 成功。
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "本次无文件变化，跳过提交"
            exit 0
          fi
          # runner 的时钟是 UTC：北京 03:25 生成的那期，日期会被写成前一天。
          # 提交信息对不上内容，事后查「哪天出了什么」全靠猜。
          git commit -m "🤖 自动生成每日深度播客 [$(TZ=Asia/Shanghai date '+%Y-%m-%d')]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::warning::推送三次均失败，本期音频已生成但未写入仓库历史；页面仍会通过 artifact 部署"
          exit 0

      - name: Sync Latest docs Before Deploy
        # 只部署的那趟，手上是「触发出这次运行的提交」，可能比远端旧。
        # 如果期间刚好有一趟定时任务生成完并推了新一期，直接拿旧 checkout 上线
        # 等于把新一期盖回去。上传前先对齐到远端最新，最坏情况也只是重复部署同一份。
        if: github.event_name == 'push'
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          echo "已对齐到 $(git log --oneline -1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
